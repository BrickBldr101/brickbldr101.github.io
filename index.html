<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
        <meta http-equiv="Pragma" content="no-cache">
        <meta http-equiv="Expires" content="0">
        <meta property="og:title" content="BibleLookup">
        <meta property="og:description" content="Look up and share Bible verses instantly.">
        <meta property="og:image" content="https://brickbldr101.github.io/assets/cross.png">
        <meta property="og:url" content="https://brickbldr101.github.io/">
        <meta property="og:type" content="website">
        <link rel="stylesheet" href="styles.css?1.0.1">
        <title>VOTD - BibleLookup</title>
        <link rel="icon" type="image/png" href="assets/cross.png">
    </head>
    <body>
        <div class="page"> 
            <div class="header">
                <div id="headerBox"></div>
                <div id="VOTD">
                    <button type="button" class="buttons" id="votd"><img src="assets/house.svg"></button>
                </div>
                
                <div id="input">
                    <input id="textbox" placeholder="Verse">
                    <button type="button" id="submit" class="buttons"><img src="assets/search.svg"></button>
                </div>
            </div>
            <main>
                <h1>BibleLookup</h1>
                <div id="audio">
                    <br><button type="button" id="read" class="buttons"><img src="assets/headphones.svg"></button>
                    <button type="button" id="stop" class="buttons"><img src="assets/stop.svg"></button>
                    <button type="button" id="resume" class="buttons"><img src="assets/play.svg"></button>
                    <button type="button" id="pause" class="buttons"><img src="assets/pause.svg"></button>
                </div>
                <p id="verse"></p>
                <div id="other">
                    <button type="button" id="lastChapter" class="buttons"><img src="assets/skip-backward.svg"></button>
                    <button type="button" id="share" class="buttons"><img src="assets/share.svg"></button>
                    <button type="button" id="nextChapter" class="buttons"><img src="assets/skip-forward.svg"></button>
                </div>
            </main>
            <div class="footer">
                <a href="https://brickbldr101.github.io/">BibleLookup</a><br>
                <a href="https://labs.bible.org/api_web_service">Bible API (NET)</a><br>
                <a href="https://netbible.org/">NET Bible</a>
            </div>
        </div>
        <script src="script.js?v=1.1.2"></script>
    </body>
</html>
