<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navbar - Bulletproof Version</title>
    <style>
        /* 1. RESET & BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }

        /* 2. THE NAVBAR - Uses Sticky to push content down */
        .navbar {
            background: #2c3e50;
            color: white;
            height: 70px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            width: 100%;
            z-index: 9999; /* Stay on top of everything */
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .nav-container {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ecf0f1;
            text-decoration: none;
        }

        /* 3. NAVIGATION LINKS (DESKTOP) */
        .nav-links {
            display: flex;
            list-style: none;
            transition: 0.3s ease-in-out;
        }

        .nav-links li {
            margin-left: 25px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        /* 4. HAMBURGER BUTTON (HIDDEN ON DESKTOP) */
        #menu-btn {
            display: none;
            flex-direction: column;
            justify-content: space-around;
            width: 30px;
            height: 25px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10000;
            padding: 0;
        }

        #menu-btn span {
            width: 30px;
            height: 4px;
            background: white;
            border-radius: 10px;
            transition: 0.3s;
        }

        /* 5. MOBILE STYLES (Screen smaller than 768px) */
        @media screen and (max-width: 768px) {
            #menu-btn {
                display: flex; /* Show the button */
            }

            .nav-links {
                position: fixed;
                top: 70px; /* Right below the navbar */
                left: -100%; /* Hide to the left */
                flex-direction: column;
                background: #34495e;
                width: 100%;
                height: 100vh;
                text-align: center;
                padding-top: 50px;
            }

            /* This class is added by JavaScript */
            .nav-links.active {
                left: 0;
            }

            .nav-links li {
                margin: 20px 0;
            }

            /* Animation for the Hamburger to "X" */
            .open span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
            .open span:nth-child(2) { opacity: 0; }
            .open span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }
        }

        /* 6. CONTENT TO PROVE PUSHING EFFECT */
        .hero {
            padding: 60px 20px;
            background: #ecf0f1;
            text-align: center;
            border-bottom: 2px solid #bdc3c7;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">Verbum</a>
            
            <button id="menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-links" id="nav-menu">
                <li><a href="/readingplans/">Reading plans</a></li>
                <li><a href="/biblestudies/">Bible studies</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>
    </nav>
    <script>
        // 1. Grab the elements
        const btn = document.getElementById('menu-btn');
        const menu = document.getElementById('nav-menu');

        // 2. Add the click event
        btn.onclick = function() {
            // Log to console so you can check F12 (Inspect Element)
            console.log("Button was clicked!");
            
            // Toggle the visibility of the menu
            menu.classList.toggle('active');
            
            // Toggle the 'X' animation on the button
            btn.classList.toggle('open');
        };

        // 3. Close the menu when a link is clicked
        const links = document.querySelectorAll('.nav-links a');
        links.forEach(link => {
            link.onclick = function() {
                menu.classList.remove('active');
                btn.classList.remove('open');
            };
        });
    </script>
</body>
</html>
